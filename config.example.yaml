# 复制为仓库根目录的 config.yaml。字符串使用引号，数字和布尔值保持原样。
client:
  # 随静态构建发布。浏览器可访问的 API 地址，同源部署可省略。
  apiBaseURL: "http://127.0.0.1:4000"
  homepage: "https://www.example.com"
  github: "https://github.com/example"
  email: "mail@example.com"
  metadata:
    title: "My Timeline"
    description: "What does this guy say?"

server:
  listeningPort: 4000
  # 指定客户端的 Origin。省略时允许所有来源。
  # allowedOrigin: "https://timeline.example.com"
  # 未单独设置同步频率的来源每 30 分钟同步一次。
  syncInterval: "*/30 * * * *"

  database:
    host: "127.0.0.1"
    port: 5432
    database: "timeline"
    user: "your_postgresql_user"
    password: "your_postgresql_password"

  # 启用管理员时取消整段注释并填写自己的 JWT 密钥和账号。
  # admin:
  #   secretKey: "your_jwt_secret"
  #   accounts:
  #     - username: "your_admin_username"
  #       password: "your_admin_password"

  # 添加来源时移除 []，再取消所需条目的注释。每项的 id 必须唯一且稳定。
